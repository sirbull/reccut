<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'" />
  <title>Reccut Preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .tools { position: fixed; top: 16px; right: 16px; display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: #202022ed; border-radius: 8px; transition: opacity .2s; }
    body.idle { cursor: none; }
    body.idle .tools { opacity: 0; pointer-events: none; }
    .tools:focus-within { opacity: 1 !important; pointer-events: auto !important; }
    button { background: #39393d; color: inherit; border: 1px solid #61616a; border-radius: 5px; padding: 7px 12px; cursor: pointer; font: inherit; }
    #status { position: fixed; bottom: 24px; width: 100%; text-align: center; color: #aaa; }
  </style>
</head>
<body>
  <video autoplay muted playsinline aria-label="Live editor preview"></video>
  <div class="tools"><span>Space to play or pause · Esc to return</span><button type="button">Return Preview to Editor</button></div>
  <div id="status" role="status">Connecting preview…</div>
  <script type="module" src="external-preview.js"></script>
</body>
</html>
