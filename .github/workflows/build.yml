name: Bygg installasjonsfiler

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the draft once. Uploading later assets must preserve publication state
  # so macOS can be published while Windows is still building.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Reccut ${GITHUB_REF_NAME#v}"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # Ingen kodesignering foreløpig.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test

      - run: node scripts/build.mjs

      - name: Bygg for Windows
        if: matrix.name == 'windows'
        run: npx electron-builder --win --x64 --publish never

      - name: Bygg for Linux
        if: matrix.name == 'linux'
        run: npx electron-builder --linux --x64 --publish never

      - name: Bygg for Mac (Apple Silicon)
        if: matrix.name == 'mac'
        run: |
          node scripts/fetch-ffmpeg.mjs mac-arm64
          npx electron-builder --mac --arm64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Reccut-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

      - name: Legg ved i release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
