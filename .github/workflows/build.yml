name: Bygg installasjonsfiler

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Optional Apple Silicon TTS engine. No model weights or installer changes.
  voxcpm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/checkout@v7
        with:
          repository: tc-mb/llama.cpp-omni
          ref: d30f00feadb7ebce95bacd55b0d104e3ef501481
          path: .voxcpm-source
          persist-credentials: false
      - name: Bygg VoxCPM2 (Apple Silicon / Metal)
        run: bash native/voxcpm/build-mac.sh .voxcpm-source voxcpm-artifacts
      - name: Klargjør syntetiske stemmereferanser
        run: node scripts/prepare-voxcpm-voices.mjs voxcpm-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: Reccut-VoxCPM-mac
          path: voxcpm-artifacts/reccut-voxcpm-*
          if-no-files-found: error
      - name: Legg ved i release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: voxcpm-artifacts/reccut-voxcpm-*

  # Keystroke Add-on: a separate helper that Reccut downloads only when the user asks for it.
  # It is attached to the release next to the installers, never put inside them.
  keystrokes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            file: reccut-keystrokes-mac
          - os: windows-latest
            file: reccut-keystrokes-win-x64.exe
          - os: ubuntu-latest
            file: reccut-keystrokes-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: native/keystrokes
    steps:
      - uses: actions/checkout@v7

      - name: Bygg for Mac
        if: runner.os == 'macOS'
        run: |
          clang -O2 -Wall -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -o ${{ matrix.file }} keystrokes-mac.c -framework ApplicationServices
          codesign --force -s - ${{ matrix.file }}

      - name: Bygg for Windows
        if: runner.os == 'Windows'
        run: gcc -O2 -Wall -s -o ${{ matrix.file }} keystrokes-win.c -luser32

      - name: Bygg for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev
          gcc -O2 -Wall -s -o ${{ matrix.file }} keystrokes-linux.c -lX11 -lXtst -lpthread

      - name: Kontrollsum
        run: |
          if command -v sha256sum >/dev/null; then sha256sum ${{ matrix.file }} > ${{ matrix.file }}.sha256
          else shasum -a 256 ${{ matrix.file }} > ${{ matrix.file }}.sha256; fi
          cat ${{ matrix.file }}.sha256
          ./${{ matrix.file }} --check || true

      - uses: actions/upload-artifact@v7
        with:
          name: Reccut-Keystrokes-${{ runner.os }}
          path: |
            native/keystrokes/${{ matrix.file }}
            native/keystrokes/${{ matrix.file }}.sha256
          if-no-files-found: error

      - name: Legg ved i release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            native/keystrokes/${{ matrix.file }}
            native/keystrokes/${{ matrix.file }}.sha256

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # Ingen kodesignering foreløpig.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test

      - run: node scripts/build.mjs

      - name: Bygg for Windows
        if: matrix.name == 'windows'
        run: npx electron-builder --win --x64 --publish never

      - name: Bygg for Linux
        if: matrix.name == 'linux'
        run: npx electron-builder --linux --x64 --publish never

      # FFmpeg er en egen binærfil per arkitektur, så Mac bygges i to omganger.
      - name: Bygg for Mac (Apple Silicon)
        if: matrix.name == 'mac'
        run: |
          node scripts/fetch-ffmpeg.mjs mac-arm64
          npx electron-builder --mac --arm64 --publish never

      - name: Bygg for Mac (Intel)
        if: matrix.name == 'mac'
        run: |
          node scripts/fetch-ffmpeg.mjs mac-x64
          npx electron-builder --mac --x64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Reccut-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

      - name: Legg ved i release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
